# Builds both apps and publishes them as a GitHub release, which both apps update from: Snowpuff.dmg for people on
# a Mac, Snowpuff.zip for the Mac updater, Snowpuff-Setup.exe for Windows.
# Starts from a pushed tag like v1.3.0, or by hand: Actions → Release → Run workflow, with the version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 1.3.0"
        required: true
      notes:
        description: "What changed"
        required: false

permissions:
  contents: write

env:
  VERSION_INPUT: ${{ inputs.version || github.ref_name }}

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          version=${VERSION_INPUT#v}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Resources/Info.plist
      - name: Rust core for both Mac architectures
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: ./build.sh
      - name: Disk image and update archive
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Snowpuff.app dist/Snowpuff.zip
          stage=$(mktemp -d)
          ditto build/Snowpuff.app "$stage/Snowpuff.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname Snowpuff -srcfolder "$stage" -format UDZO -ov dist/Snowpuff.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # apt on the runners sometimes hangs: give it a few tries, each with a time limit.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            timeout 240 sudo apt-get update -q -o Acquire::Retries=3 && timeout 300 sudo apt-get install -y -q --no-install-recommends mingw-w64 && break
            sleep 10
          done
          rustup target add x86_64-pc-windows-gnu
      - name: Build
        working-directory: windows
        run: |
          version=${VERSION_INPUT#v}
          sed -i "0,/^version = /s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          target=x86_64-pc-windows-gnu
          release=$PWD/target/$target/release
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          cargo build --release --target $target --bin Snowpuff
          SNOWPUFF_APP=$release/Snowpuff.exe cargo build --release --target $target --bin Snowpuff-Setup --features setup
          mkdir -p ../dist
          cp $release/Snowpuff-Setup.exe ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          version=${VERSION_INPUT#v}
          tag=v$version
          git fetch --force --tags origin
          notes=$NOTES_INPUT
          [ -n "$notes" ] || notes=$(git for-each-ref "refs/tags/$tag" --format='%(contents)')
          [ -n "$notes" ] || notes="Snowpuff $version"
          files="dist/Snowpuff.dmg dist/Snowpuff.zip dist/Snowpuff-Setup.exe"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "Snowpuff $version" --notes "$notes"
          fi
